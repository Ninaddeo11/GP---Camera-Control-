[pytest]
; This service's modules use bare top-level imports (`import config`,
; `import plate_normalizer`, ...), not a package — matching how the
; Dockerfile/entrypoint runs `python main.py` from this directory with no
; installed package. `pythonpath = .` puts this directory on sys.path for
; pytest the same way running python from here already does, so tests can
; `import config` etc. without needing services/inference turned into an
; installed package just to be testable.
pythonpath = .
testpaths = tests
