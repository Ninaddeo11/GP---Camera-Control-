# Render Blueprint — deploys just the auth/dashboard/RBAC backend (api +
# redis), not the video/inference pipeline (that needs real camera access
# and heavier compute, and is intentionally out of scope for this pass —
# see docs/anpr-pipeline.md and README.md for what it needs when that's
# ready). Postgres is NOT provisioned here: this project already uses a
# Supabase-hosted Postgres (see .env's DATABASE_URL comment for why the
# session pooler specifically, not the direct connection or transaction
# pooler) — DATABASE_URL below is provided manually in the Render
# dashboard, not generated by this blueprint, so the Supabase password
# never needs to touch this file or git.
#
# Deploy: Render dashboard -> New -> Blueprint -> connect this repo ->
# Render finds this file automatically. You'll be prompted for the
# `sync: false` values below during setup.
#
# Free-tier caveats, both accepted trade-offs for "just needs to be
# reachable, not always warm" rather than paying for always-on:
#   - The web service sleeps after ~15 minutes idle; the next request
#     pays a 30-60s cold start while it wakes up.
#   - Render's free Redis-compatible "Key Value" plan is memory-limited
#     and (per Render's current policy at blueprint-authoring time —
#     verify in your dashboard, since free-tier terms do change) may
#     expire after a fixed period rather than persisting indefinitely.
#     This app only uses Redis for short-lived state (rate-limit
#     counters, refresh-token blacklist entries, the plate/vehicle/
#     watchlist event streams) — nothing here needs Redis data to survive
#     forever, so a reset losing that state is a non-event, not a
#     data-loss risk. Upgrade the plan if that stops being true (e.g. once
#     the inference pipeline is added and its event streams matter more).

services:
  - type: web
    name: gp-sentinel-api
    runtime: docker
    dockerfilePath: ./services/api/Dockerfile
    dockerContext: ./services/api
    plan: free
    healthCheckPath: /healthz
    envVars:
      # Supabase connection string (session pooler, +asyncpg, ?ssl=require)
      # — see .env's DATABASE_URL comment for the full reasoning on why
      # it must be the session pooler specifically. Never put the real
      # value in this file.
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        fromService:
          type: redis
          name: gp-sentinel-redis
          property: connectionString
      # Render generates a real random secret here instead of reusing the
      # repo's "change-me-super-secret-key" dev default.
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: JWT_ALGORITHM
        value: HS256
      - key: JWT_ACCESS_TOKEN_EXPIRE_MINUTES
        value: "15"
      - key: JWT_REFRESH_TOKEN_EXPIRE_DAYS
        value: "7"
      # Comma-separated allowed browser origins — set this to your actual
      # Vercel production domain (and any preview domains you test from)
      # once deployed. A Vercel preview URL changes per-deploy, so revisit
      # this after your first real production deploy rather than a
      # preview one.
      - key: CORS_ORIGINS
        sync: false
      - key: ENVIRONMENT
        value: production
      - key: LOG_LEVEL
        value: INFO

  - type: redis
    name: gp-sentinel-redis
    plan: free
    ipAllowList: []
