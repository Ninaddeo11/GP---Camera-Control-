# Reverse proxy + TLS termination for the web dashboard and API.
#
# go2rtc (WHEP/HLS, :1984) is deliberately NOT proxied here — the browser
# connects to it directly (see apps/web/lib/use-whep.ts's documented
# caveat on why that's a known gap, not a design choice). Terminating TLS
# in front of go2rtc too, and adding an authenticating layer, is Phase 10
# follow-up work tracked in README.md, not yet done.

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout 65;

    # Self-signed for dev (see infra/nginx/generate-self-signed-cert.sh);
    # swap for a real certificate path in production.
    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # 127.0.0.11 is Docker's embedded DNS server on every user-defined
    # bridge network. Needed so proxy_pass targets below can be re-resolved
    # at request time (see the `set $upstream_*` + proxy_pass $variable
    # pattern) instead of nginx's default behavior of resolving a bare
    # `proxy_pass http://hostname:port;` target ONCE at config load and
    # caching that IP forever — confirmed the hard way, repeatedly: every
    # time `web` or `api` got rebuilt/recreated during this project's
    # development, it got a new container IP, and nginx kept proxying to
    # the old (now-dead) one until manually restarted, producing a 502
    # that looked like an application bug. valid=10s bounds how stale the
    # cached IP can get after a real container recreation, without
    # re-resolving on literally every request.
    resolver 127.0.0.11 valid=10s;

    server {
        listen 80;
        server_name _;
        return 301 https://$host$request_uri;
    }

    server {
        listen 443 ssl;
        server_name _;

        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        # connect-src includes the go2rtc origin the BROWSER actually
        # resolves (not the docker-internal "go2rtc" hostname — the
        # browser can't see that network at all) plus ws(s): for the live
        # alert stream. Keep this in sync with
        # NEXT_PUBLIC_GO2RTC_WHEP_BASE_URL in .env if that's ever anything
        # other than localhost:1984.
        #
        # script-src needs 'unsafe-inline': confirmed the hard way (a
        # completely blank login page, first time this was ever tested in
        # a real browser) — Next.js's App Router injects its own inline
        # bootstrap scripts on every page (the `self.__next_f.push(...)`
        # payloads that carry RSC streaming/hydration data) that aren't
        # optional and aren't served as external files, so a bare
        # `script-src 'self'` blocks React from ever hydrating, not just
        # some third-party script. The correct hardening beyond this is
        # per-request CSP nonces threaded through Next.js middleware into
        # every inline script tag — real work, not a one-line change, and
        # not done here; tracked as a Transformation Phase 15 follow-up
        # (see README.md "Known gaps"), not silently left insecure without
        # a note.
        add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; connect-src 'self' ws: wss: http://localhost:1984; frame-ancestors 'none';" always;

        location / {
            set $upstream_web http://web:3000;
            proxy_pass $upstream_web;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /api/alerts/stream {
            # No path on the variable's value (see location /api/'s
            # comment below for why) — nginx forwards the client's
            # original URI unchanged after it, landing on the identical
            # /api/alerts/stream path on the api container.
            set $upstream_api_ws http://api:8000;
            proxy_pass $upstream_api_ws;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_read_timeout 3600s;
        }

        # Proxies go2rtc's WHEP/API port over the same HTTPS origin as
        # everything else. Without this, the dashboard (served over
        # https://localhost) calling go2rtc directly at
        # http://localhost:1984 is a mixed-content request — browsers
        # silently block it, which is exactly why the video wall's tiles
        # sat on "connecting" then flipped to "error" (confirmed by
        # testing in a real browser after fixing camera sync — cameras
        # loaded, but no tile ever actually connected). The previous
        # workaround for this was accessing the dashboard directly on
        # :3000 over plain HTTP, which this project stopped publishing
        # (see docker-compose.yml's web service comment) because it
        # caused a *different*, worse failure mode for login. Proxying
        # go2rtc here instead fixes both at once, on the one correct
        # origin.
        location ~ ^/go2rtc/(.*)$ {
            # A regex location with a capture group, not `rewrite ...
            # break;` + a variable proxy_pass — confirmed the hard way that
            # combination makes nginx fail every request with "invalid URL
            # prefix in ''" (500), because evaluating a variable
            # proxy_pass together with a same-location rewrite/break
            # breaks nginx's URL parsing. Appending $1 straight onto the
            # variable here sidesteps that entirely and still gets the
            # required per-request DNS re-resolution (see the `resolver`
            # directive above).
            set $upstream_go2rtc http://go2rtc:1984;
            proxy_pass $upstream_go2rtc/$1$is_args$args;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /api/ {
            # Deliberately no trailing /api/ on the variable's value —
            # confirmed the hard way that it matters: nginx only does its
            # normal "replace the matched location prefix with proxy_pass's
            # own URI part" rewriting when proxy_pass is a static string.
            # The instant proxy_pass uses a variable (required for
            # per-request DNS re-resolution, see the `resolver` directive
            # above), that rewriting is disabled entirely and nginx instead
            # forwards the client's ORIGINAL request URI unchanged after
            # the variable's value. Since this app's real routes already
            # live under /api/ (e.g. /api/auth/login), forwarding the
            # original URI verbatim is exactly what's wanted — adding
            # /api/ here too would have duplicated it, which is exactly
            # the bug this comment is here to stop someone reintroducing.
            set $upstream_api http://api:8000;
            proxy_pass $upstream_api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
