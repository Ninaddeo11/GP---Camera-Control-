# Reverse proxy + TLS termination for the web dashboard and API.
#
# go2rtc (WHEP/HLS, :1984) is deliberately NOT proxied here — the browser
# connects to it directly (see apps/web/lib/use-whep.ts's documented
# caveat on why that's a known gap, not a design choice). Terminating TLS
# in front of go2rtc too, and adding an authenticating layer, is Phase 10
# follow-up work tracked in README.md, not yet done.

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout 65;

    # Self-signed for dev (see infra/nginx/generate-self-signed-cert.sh);
    # swap for a real certificate path in production.
    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    server {
        listen 80;
        server_name _;
        return 301 https://$host$request_uri;
    }

    server {
        listen 443 ssl;
        server_name _;

        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        # connect-src includes the go2rtc origin the BROWSER actually
        # resolves (not the docker-internal "go2rtc" hostname — the
        # browser can't see that network at all) plus ws(s): for the live
        # alert stream. Keep this in sync with
        # NEXT_PUBLIC_GO2RTC_WHEP_BASE_URL in .env if that's ever anything
        # other than localhost:1984.
        #
        # script-src needs 'unsafe-inline': confirmed the hard way (a
        # completely blank login page, first time this was ever tested in
        # a real browser) — Next.js's App Router injects its own inline
        # bootstrap scripts on every page (the `self.__next_f.push(...)`
        # payloads that carry RSC streaming/hydration data) that aren't
        # optional and aren't served as external files, so a bare
        # `script-src 'self'` blocks React from ever hydrating, not just
        # some third-party script. The correct hardening beyond this is
        # per-request CSP nonces threaded through Next.js middleware into
        # every inline script tag — real work, not a one-line change, and
        # not done here; tracked as a Transformation Phase 15 follow-up
        # (see README.md "Known gaps"), not silently left insecure without
        # a note.
        add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; connect-src 'self' ws: wss: http://localhost:1984; frame-ancestors 'none';" always;

        location / {
            proxy_pass http://web:3000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /api/alerts/stream {
            proxy_pass http://api:8000/api/alerts/stream;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_read_timeout 3600s;
        }

        location /api/ {
            proxy_pass http://api:8000/api/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
